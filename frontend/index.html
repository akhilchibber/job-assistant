<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Job Application Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 2.5rem;
      width: 100%;
      max-width: 560px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 0.3rem;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 2rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #333;
      margin-bottom: 0.4rem;
    }

    input[type="text"], input[type="email"] {
      width: 100%;
      padding: 0.65rem 0.9rem;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
      margin-bottom: 1.2rem;
      transition: border-color 0.2s;
      outline: none;
    }

    input:focus { border-color: #4f46e5; }

    button#generateBtn {
      width: 100%;
      padding: 0.75rem;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button#generateBtn:hover:not(:disabled) { background: #4338ca; }
    button#generateBtn:disabled { background: #a5b4fc; cursor: not-allowed; }

    .status-box {
      margin-top: 1.8rem;
      display: none;
    }

    .status-box h2 {
      font-size: 0.85rem;
      font-weight: 700;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.8rem;
    }

    .status-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .status-list li {
      font-size: 0.9rem;
      color: #333;
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #ddd;
      border-top-color: #4f46e5;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
      margin-top: 2px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .download-btn {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.65rem 1.4rem;
      background: #10b981;
      color: #fff;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s;
    }

    .download-btn:hover { background: #059669; }

    .error-msg {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      background: #fef2f2;
      border: 1px solid #fca5a5;
      border-radius: 8px;
      color: #b91c1c;
      font-size: 0.9rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🤖 AI Job Application Assistant</h1>
    <p class="subtitle">Paste a job posting URL — get a tailored cover letter and an email sent automatically.</p>

    <label for="jobUrl">Job Posting URL</label>
    <input type="text" id="jobUrl" placeholder="https://company.com/jobs/software-engineer" />

    <label for="senderEmail">Your Email (to send from)</label>
    <input type="email" id="senderEmail" placeholder="rishika3895@gmail.com" value="rishika3895@gmail.com" />

    <button id="generateBtn" onclick="generate()">Generate &amp; Send Application</button>

    <div class="error-msg" id="errorMsg"></div>

    <div class="status-box" id="statusBox">
      <h2>Status</h2>
      <ul class="status-list" id="statusList"></ul>
      <a id="downloadBtn" class="download-btn" href="#" target="_blank" style="display:none;">
        ⬇ Download Cover Letter PDF
      </a>
    </div>
  </div>

  <script>
    // Replace with your Hugging Face Spaces backend URL after deployment
    const BACKEND_URL = "https://YOUR-HF-SPACE.hf.space";

    async function generate() {
      const jobUrl = document.getElementById("jobUrl").value.trim();
      const senderEmail = document.getElementById("senderEmail").value.trim();
      const errorMsg = document.getElementById("errorMsg");
      const statusBox = document.getElementById("statusBox");
      const statusList = document.getElementById("statusList");
      const downloadBtn = document.getElementById("downloadBtn");
      const btn = document.getElementById("generateBtn");

      // Reset UI
      errorMsg.style.display = "none";
      statusBox.style.display = "none";
      statusList.innerHTML = "";
      downloadBtn.style.display = "none";

      if (!jobUrl || !senderEmail) {
        showError("Please fill in both fields.");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Working…";
      statusBox.style.display = "block";
      addStatus("⏳ Starting pipeline…");

      try {
        const res = await fetch(`${BACKEND_URL}/generate`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ job_url: jobUrl, sender_email: senderEmail }),
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.detail || "Server error");
        }

        const data = await res.json();

        // Show status log from backend
        statusList.innerHTML = "";
        (data.status_log || []).forEach(msg => addStatus("✅ " + msg));
        addStatus("📧 Email: " + data.email_status);

        if (data.cover_letter_url) {
          downloadBtn.href = data.cover_letter_url;
          downloadBtn.style.display = "inline-block";
        }

      } catch (err) {
        showError("Error: " + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "Generate & Send Application";
      }
    }

    function addStatus(msg) {
      const li = document.createElement("li");
      li.textContent = msg;
      document.getElementById("statusList").appendChild(li);
    }

    function showError(msg) {
      const el = document.getElementById("errorMsg");
      el.textContent = msg;
      el.style.display = "block";
    }
  </script>
</body>
</html>
