<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Job Application Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 2.5rem;
      width: 100%;
      max-width: 580px;
    }

    .header { margin-bottom: 2rem; }
    h1 { font-size: 1.4rem; font-weight: 700; color: #1a1a2e; margin-bottom: 0.3rem; }
    .subtitle { font-size: 0.9rem; color: #666; line-height: 1.5; }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #333;
      margin-bottom: 0.4rem;
    }

    input[type="text"], input[type="email"] {
      width: 100%;
      padding: 0.65rem 0.9rem;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
      margin-bottom: 1.2rem;
      transition: border-color 0.2s;
      outline: none;
      color: #1a1a2e;
    }
    input:focus { border-color: #4f46e5; }

    button#generateBtn {
      width: 100%;
      padding: 0.8rem;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    button#generateBtn:hover:not(:disabled) { background: #4338ca; }
    button#generateBtn:disabled { background: #a5b4fc; cursor: not-allowed; }

    /* Spinner inside button */
    .btn-spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Timer */
    .timer {
      display: none;
      margin-top: 0.8rem;
      font-size: 0.85rem;
      color: #888;
      text-align: center;
    }

    /* Status box */
    .status-box { margin-top: 1.8rem; display: none; }
    .status-box h2 {
      font-size: 0.8rem;
      font-weight: 700;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.8rem;
    }

    .status-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }
    .status-list li {
      font-size: 0.9rem;
      color: #333;
      padding: 0.4rem 0.6rem;
      background: #f8fafc;
      border-radius: 6px;
      border-left: 3px solid #4f46e5;
    }
    .status-list li.email-line { border-left-color: #10b981; }
    .status-list li.skip-line  { border-left-color: #f59e0b; }

    .download-btn {
      display: none;
      margin-top: 1.4rem;
      width: 100%;
      padding: 0.75rem;
      background: #10b981;
      color: #fff;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      text-align: center;
      transition: background 0.2s;
    }
    .download-btn:hover { background: #059669; }

    .error-msg {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      background: #fef2f2;
      border: 1px solid #fca5a5;
      border-radius: 8px;
      color: #b91c1c;
      font-size: 0.9rem;
      display: none;
    }

    .divider {
      border: none;
      border-top: 1px solid #eee;
      margin: 1.5rem 0 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>🤖 AI Job Application Assistant</h1>
      <p class="subtitle">Paste a job posting URL. The system will generate a tailored cover letter and email it to the hiring contact automatically.</p>
    </div>

    <label for="jobUrl">Job Posting URL</label>
    <input type="text" id="jobUrl" placeholder="https://company.com/jobs/software-engineer" />

    <label for="senderEmail">Send from (Gmail)</label>
    <input type="email" id="senderEmail" value="rishika3895@gmail.com" />

    <button id="generateBtn" onclick="generate()">
      <span class="btn-spinner" id="btnSpinner"></span>
      <span id="btnText">Generate &amp; Send Application</span>
    </button>

    <p class="timer" id="timer">Processing... <span id="elapsed">0</span>s</p>

    <div class="error-msg" id="errorMsg"></div>

    <div class="status-box" id="statusBox">
      <hr class="divider" />
      <h2>Pipeline Status</h2>
      <ul class="status-list" id="statusList"></ul>
      <a id="downloadBtn" class="download-btn" href="#" target="_blank">
        ⬇ Download Cover Letter PDF
      </a>
    </div>
  </div>

  <script>
    // -----------------------------------------------------------------------
    // CONFIG
    // -----------------------------------------------------------------------
    const BACKEND_URL = "https://akhilchibber-job-assistant.hf.space";

    // -----------------------------------------------------------------------
    // Timer
    // -----------------------------------------------------------------------
    let timerInterval = null;
    let startTime = null;

    function startTimer() {
      startTime = Date.now();
      document.getElementById("timer").style.display = "block";
      timerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        document.getElementById("elapsed").textContent = elapsed;
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      document.getElementById("timer").style.display = "none";
    }

    // -----------------------------------------------------------------------
    // Main generate function
    // -----------------------------------------------------------------------
    async function generate() {
      const jobUrl     = document.getElementById("jobUrl").value.trim();
      const senderEmail = document.getElementById("senderEmail").value.trim();
      const errorMsg   = document.getElementById("errorMsg");
      const statusBox  = document.getElementById("statusBox");
      const statusList = document.getElementById("statusList");
      const downloadBtn = document.getElementById("downloadBtn");
      const btn        = document.getElementById("generateBtn");
      const btnSpinner = document.getElementById("btnSpinner");
      const btnText    = document.getElementById("btnText");

      // Reset
      errorMsg.style.display = "none";
      statusBox.style.display = "none";
      statusList.innerHTML = "";
      downloadBtn.style.display = "none";

      if (!jobUrl) { showError("Please paste a job posting URL."); return; }
      if (!senderEmail) { showError("Please enter your email address."); return; }

      // Loading state
      btn.disabled = true;
      btnSpinner.style.display = "block";
      btnText.textContent = "Working…";
      startTimer();

      try {
        const res = await fetch(`${BACKEND_URL}/generate`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ job_url: jobUrl, sender_email: senderEmail }),
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.detail || "Server error");
        }

        // Render status log
        statusBox.style.display = "block";
        (data.status_log || []).forEach(msg => addStatus("✅ " + msg));

        // Email status line
        const emailStatus = data.email_status || "not attempted";
        const isSkipped = emailStatus.toLowerCase().includes("skip");
        const isFailed  = emailStatus.toLowerCase().includes("fail");
        const emailClass = isSkipped ? "skip-line" : isFailed ? "" : "email-line";
        const emailIcon  = isSkipped ? "⚠️" : isFailed ? "❌" : "📧";
        addStatus(`${emailIcon} Email: ${emailStatus}`, emailClass);

        // Download button
        if (data.cover_letter_url) {
          downloadBtn.href = data.cover_letter_url;
          downloadBtn.style.display = "block";
        }

      } catch (err) {
        showError("Error: " + err.message);
      } finally {
        btn.disabled = false;
        btnSpinner.style.display = "none";
        btnText.textContent = "Generate & Send Application";
        stopTimer();
      }
    }

    function addStatus(msg, extraClass = "") {
      const li = document.createElement("li");
      li.textContent = msg;
      if (extraClass) li.classList.add(extraClass);
      document.getElementById("statusList").appendChild(li);
    }

    function showError(msg) {
      const el = document.getElementById("errorMsg");
      el.textContent = msg;
      el.style.display = "block";
    }
  </script>
</body>
</html>
